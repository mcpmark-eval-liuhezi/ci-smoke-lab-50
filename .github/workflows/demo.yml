name: Demo Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Write build marker
        run: |
          echo "demo-build marker" > demo-build.txt
          chmod +x demo-build.txt
          cat demo-build.txt
      - name: Upload demo-build artifact
        uses: actions/upload-artifact@v4
        with:
          name: demo-build
          path: demo-build.txt
          retention-days: 30
